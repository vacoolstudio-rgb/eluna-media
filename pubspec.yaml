name: eluna_media
description: "Eluna Media — офлайн-конвертер фото, видео и аудио. Всё считается на устройстве."
publish_to: 'none'
# Номер версии заморожен на 1.0.0 по решению владельца и не двигается, пока он
# не скажет. Растёт только номер сборки после «+»: его требует и Play, и сам
# телефон — установка поверх сборки с тем же номером отклоняется. В приложении
# показывается ТОЛЬКО «1.0.0»: номер сборки нужен в отчёте об ошибке, а не в
# настройках. Обе половины читаются из бандла (`ElunaVersion`), поэтому в коде
# версия нигде не записана.
version: 1.0.0+8

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.6.2
  flutter_riverpod: ^3.3.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  # Общий код семьи Eluna: тема, дизайн-система, оценка, лицензии, языки,
  # логирование и краш-файл. Пинится тегом; pubspec.lock фиксирует коммит.
  # См. docs/CONTRACT.md в самом пакете о границе между ним и приложением.
  eluna_shared:
    git:
      url: https://github.com/vacoolstudio-rgb/eluna-shared.git
      ref: v0.19.1
  # Прямая зависимость: дизайн-система пакета (SectionIcon, SectionHeader,
  # EmptyState) принимает HugeIconData, а не Material IconData — значит имена
  # иконок называет само приложение. Версия та же, на которой стоит пакет.
  hugeicons: ^1.1.7
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^20.1.0
  intl: ^0.20.2
  in_app_review: ^2.0.10
  gal: ^2.3.1
  dynamic_color: ^1.7.0
  battery_plus: ^6.2.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  # Чаевые. 3.3.0+ везёт in_app_purchase_android 0.5.x = Play Billing Library 8:
  # обновления на более старых Play перестанет принимать с 2026-08-31. Та же
  # версия, что у Eluna Screen.
  #
  # Разрешения INTERNET плагин НЕ добавляет (его манифест пуст, а в сеть ходит
  # приложение Play Store, с которым он говорит межпроцессно) — это проверено на
  # собранном манифесте релиза и должно проверяться впредь: см. README.
  in_app_purchase: ^3.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    # Превью иконок для экрана выбора. Это НЕ те файлы, которые рисует
    # лаунчер — те лежат в mipmap и в каталоге iOS; здесь копии, чтобы
    # показать сетку, не спрашивая платформу.
    - assets/icons/

  # Шрифта здесь больше нет. Manrope приезжает внутри eluna_shared под именем
  # `packages/eluna_shared/Manrope` — этим именем его и просит общая тема, а
  # локальная копия лежала в сборке вторым файлом на 165 КБ, на который никто не
  # ссылался. Лицензия OFL при этом не потерялась: её текст регистрирует
  # `Eluna.configure()` из ассета пакета, и он по-прежнему виден на экране
  # лицензий.
