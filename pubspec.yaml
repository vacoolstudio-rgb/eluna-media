name: eluna_media
description: "Eluna Media — офлайн-конвертер фото, видео и аудио. Всё считается на устройстве."
publish_to: 'none'
version: 0.4.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ffmpeg_kit_flutter_new: ^4.3.2
  flutter_riverpod: ^3.3.2
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  # Общий код семьи Eluna: тема, дизайн-система, оценка, лицензии, языки,
  # логирование и краш-файл. Пинится тегом; pubspec.lock фиксирует коммит.
  # См. docs/CONTRACT.md в самом пакете о границе между ним и приложением.
  eluna_shared:
    git:
      url: https://github.com/vacoolstudio-rgb/eluna-shared.git
      ref: v0.11.0
  # Прямая зависимость: дизайн-система пакета (SectionIcon, SectionHeader,
  # EmptyState) принимает HugeIconData, а не Material IconData — значит имена
  # иконок называет само приложение. Версия та же, на которой стоит пакет.
  hugeicons: ^1.1.7
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^20.1.0
  intl: ^0.20.2
  in_app_review: ^2.0.10
  gal: ^2.3.1
  dynamic_color: ^1.7.0
  battery_plus: ^6.2.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    # Manrope, SIL Open Font License (assets/fonts/OFL.txt) — the family the
    # rest of the Eluna apps are set in.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
